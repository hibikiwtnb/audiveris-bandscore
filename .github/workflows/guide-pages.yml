name: Publish the bandscore guide

# Serves skill/docs/guide/ (the user guide) on GitHub Pages.
on:
  push:
    branches: [bandscore]
    paths:
      - 'skill/docs/guide/**'
      - '.github/workflows/guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guide-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skill/docs/guide
      - id: deployment
        uses: actions/deploy-pages@v4
